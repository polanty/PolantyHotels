<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Profile Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- TopNavBar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-gray-200 dark:border-white/10 px-6 md:px-10 py-4 bg-white dark:bg-background-dark sticky top-0 z-10">
<div class="flex items-center gap-4 text-black dark:text-white">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-xl font-bold leading-tight tracking-[-0.015em]">HotelBook</h2>
</div>
<div class="flex flex-1 justify-end items-center gap-4 md:gap-6">
<nav class="hidden md:flex items-center gap-8">
<a class="text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="#">Hotels</a>
<a class="text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="#">My Bookings</a>
<a class="text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="#">Support</a>
</nav>
<button class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-gray-100 dark:bg-white/10 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-white/20">
<span class="material-symbols-outlined text-xl">notifications</span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="User avatar of Alex Doe" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDoJ47TfbOOJpzlHd3K4bQLiAqUpf2ONgfkrAS6UP7z29t3eJlo36uJXzz76MKT3eNushcpqxt1EdDJeH4zUdzsSlWcaESHq34B-mWQE5wE_1FTtb1pKoLHiW5s0CWC9Q0Viy3-XT0RjZM1x6ebrcknVjC7tVjWojYaPTyzMdIC7NWo2ihHjQuxSa8Al9LK9MR9MLdnClTOFuJH00uRxkehVLiMwccvUunVshigTskOidNuKM3FjCqhrqUxHV3FmoQ0dyQFXK1rjFk");'></div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8 lg:p-12">
<div class="flex flex-col lg:flex-row gap-8">
<!-- SideNavBar -->
<aside class="w-full lg:w-64 flex-shrink-0">
<div class="flex flex-col gap-4 bg-white dark:bg-black/20 p-4 rounded-xl border border-gray-200 dark:border-white/10">
<div class="flex items-center gap-3 border-b border-gray-200 dark:border-white/10 pb-4">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="User avatar of Alex Doe" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAnWAR3zqadXzNipizrsZiWuo74gR3TFSeWQuIXbJUgk8BVzkz3rdq7vyg1ya-JZYJ1r6YButV-2WPhYpJUANXeWYKT_XJR_TbgRgH5lAOn0pejEywXd18A6I-UBSGPrGRJaE2e0q2MqQIeUoxWJVZOcI5YBfAGsbKIxfg1_Tfj1Zon2phQsZhq6haMlWB1_KrZuD_WJO3-Z-_kB72QyEN_AyEicINermdAAXquG92UkHyZD-lKOVkMZ-V8W3eJsY6I6luHEdTKoeU");'></div>
<div class="flex flex-col">
<h1 class="text-gray-900 dark:text-white text-base font-medium leading-normal">Alex Doe</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm font-normal leading-normal">alex.doe@email.com</p>
</div>
</div>
<div class="flex flex-col gap-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 dark:bg-primary/20 text-primary font-medium" href="#">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">person</span>
<p class="text-sm leading-normal">Personal Info</p>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 text-gray-600 dark:text-gray-300" href="#">
<span class="material-symbols-outlined text-xl">lock</span>
<p class="text-sm font-medium leading-normal">Account Settings</p>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 text-gray-600 dark:text-gray-300" href="#">
<span class="material-symbols-outlined text-xl">notifications</span>
<p class="text-sm font-medium leading-normal">Notifications</p>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 text-gray-600 dark:text-gray-300" href="#">
<span class="material-symbols-outlined text-xl">logout</span>
<p class="text-sm font-medium leading-normal">Logout</p>
</a>
</div>
</div>
</aside>
<!-- Profile Content Area -->
<div class="flex-1 flex flex-col gap-8">
<!-- Personal Info Section -->
<section class="bg-white dark:bg-black/20 p-6 md:p-8 rounded-xl border border-gray-200 dark:border-white/10" id="personal-info">
<div class="flex flex-col gap-8">
<!-- PageHeading -->
<div class="border-b border-gray-200 dark:border-white/10 pb-5">
<div class="flex flex-wrap justify-between gap-3">
<div class="flex flex-col gap-1">
<p class="text-gray-900 dark:text-white text-2xl font-bold leading-tight tracking-[-0.02em]">Personal Information</p>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Update your photo and personal details here.</p>
</div>
</div>
</div>
<!-- ProfileHeader -->
<div class="flex @container">
<div class="flex w-full flex-col gap-4 @[520px]:flex-row @[520px]:justify-between @[520px]:items-center">
<div class="flex items-center gap-4">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-24 w-24" data-alt="User avatar of Alex Doe" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDXg_Ime3yhRyI1kC7_NEOy-2XZ9uJwpDfILOaATXV-ViIFg8pqUTEh6pS4F8Zj-I1baUdLWaMxFwuclh5ibXFRnhFg-lW4D3Xz2AxAwnMsbPKR93MTSny-BrTd-uJD34v4BSwiF_i3GZ0a2u7_MM2IguuNOLspABYimOxLYxt54vKNyx5I1PVA5yvaa5YqFdrKx5pB8RzKZcZTixBVQMp1QGVP1z99Yo58HeJu9MPMAEGh8ExT0fDZUv9aGA-Mwu6VSZYhugmMOYA");'></div>
<div class="flex flex-col justify-center gap-1">
<p class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Profile Picture</p>
<p class="text-gray-500 dark:text-gray-400 text-sm font-normal leading-normal">PNG or JPG no bigger than 800px wide and tall.</p>
</div>
</div>
<div class="flex gap-2">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-gray-200 dark:bg-white/10 text-gray-800 dark:text-gray-200 text-sm font-medium leading-normal w-full @[480px]:w-auto">
<span class="truncate">Remove</span>
</button>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] w-full @[480px]:w-auto">
<span class="truncate">Change Photo</span>
</button>
</div>
</div>
</div>
<!-- Form -->
<form>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-sm font-medium leading-normal pb-2">First Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-white/20 bg-white dark:bg-black/20 h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" value="Alex"/>
</label>
<label class="flex flex-col">
<p class="text-gray-800 dark:text-gray-200 text-sm font-medium leading-normal pb-2">Last Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-white/20 bg-white dark:bg-black/20 h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" value="Doe"/>
</label>
<label class="flex flex-col md:col-span-2">
<p class="text-gray-800 dark:text-gray-200 text-sm font-medium leading-normal pb-2">Email Address</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-white/20 bg-white dark:bg-black/20 h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" type="email" value="alex.doe@email.com"/>
</label>
</div>
<div class="flex justify-end pt-8 mt-8 border-t border-gray-200 dark:border-white/10">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-5 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em]" type="submit">
<span class="truncate">Save Changes</span>
</button>
</div>
</form>
</div>
</section>
</div>
</div>
</main>
</div>
</body></html>
